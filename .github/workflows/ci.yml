name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Package
        run: ./scripts/package-extension.sh
      - name: Lint Firefox build
        run: |
          mkdir -p build/firefox
          unzip -q dist/zero-notes-firefox-*.zip -d build/firefox
          npx --yes web-ext@10.8.0 lint --source-dir build/firefox --warnings-as-errors
      - uses: actions/upload-artifact@v7
        with:
          name: extension
          path: dist/*.zip
